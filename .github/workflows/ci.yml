name: ci

# No Python, no script files. The invariant + lint gate is INLINED below and
# runs only here on GitHub (bash + jq) — nothing executes on a contributor's
# machine. To validate locally, push and read the CI result.

# Manual only (user decision 2026-09-23): run from the Actions tab via
# "Run workflow". Automatic runs on push/pull_request are off while the
# lock-primitive suite's _lock_fs_identity check is unreliable on the runner
# filesystem (it assumes a remove+recreate of the same path yields a new
# inode; the runner reuses it).
on:
  workflow_dispatch:

# Least privilege for the job token (Sentinel W1 follow-up F6): the job reads the repository and uploads an
# artifact; it writes nothing back. Without this block the token's scope is whatever the repo default is.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Frozen 3.15 knowledge inventory must be available to regression tests.

      # A15 (gate #27) needs pytest. The runner's system python3 is externally managed (PEP 668), so a
      # `pip install --user` there can be refused (Chris W1 r2 R2-3): use a setup-python interpreter instead.
      # Keep these steps single-line `run:` -- `make validate` runs the FIRST `run: |` block as the gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hash-pinned (Sentinel W1 follow-up F6, Chris C-7): pytest and every transitive dependency, sha256 per file.
      - name: Install pytest (A15 design-runner suite + W9 eval suites, gate 27)
        run: 'python3 -m pip install --quiet --require-hashes --only-binary :all: -r .github/requirements-ci.txt'

      - name: Invariant + lint gate (inline bash + jq)
        shell: bash
        env:
          RULE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e -u -o pipefail
          fail=0
          err(){ printf '  X %s\n' "$*"; fail=1; }
          ok(){  printf '  ok %s\n' "$*"; }
          sec(){ printf '\n== %s ==\n' "$*"; }
          PJ=.claude-plugin/plugin.json
          MK=.claude-plugin/marketplace.json
          command -v jq >/dev/null || { echo "FATAL: jq required"; exit 2; }
          # shipped buckets = plugin.json `skills` (one source with context-budget.py and A8)
          SHIP=$(jq -r '.skills[]' "$PJ" | sed -e 's:^\./skills/::' -e 's:/$::' | tr '\n' ' ')
          [ -n "${SHIP// /}" ] || { echo "FATAL: no skill buckets in $PJ"; exit 2; }
          EXCL="in-progress deprecated"
          F5="secure design"   # 4.0.1 (SEC-4): the two host-pinned fable types, nothing else
          # v4 ADR §7 W1: names and switches come from data, not from counts. PLUGIN = the namespace of a
          # preload/load (`<plugin>:<skill>`); REQ4 = 1 from plugin.json major 4 (the W10 switch commit) or
          # SHODE_REQUIRE_V4=1 (rehearsal) -> the gates wired in 3.17.x (#27) become required.
          PLUGIN=$(jq -r '.name' "$PJ")
          VMAJ=$(jq -r '.version' "$PJ" | cut -d. -f1)
          REQ4=0; { [ "${SHODE_REQUIRE_V4:-0}" = 1 ] || [ "${VMAJ:-0}" -ge 4 ] 2>/dev/null; } && REQ4=1
          # preload names of one agent, one per line, `<plugin>:` stripped (bare and namespaced resolve alike)
          preloads(){ awk '/^---$/{c++;next} c==1&&/^skills:/{sub(/^skills:[ \t]*/,"");print;exit}' "$1" \
                        | tr -d '[]",' | tr ' ' '\n' | sed -e "s/^$PLUGIN://" -e '/^$/d'; }
          # SKILL.md of a shipped skill (shipped buckets only; in-progress/deprecated never resolve)
          skill_md(){ for b in $SHIP; do [ -f "skills/$b/$1/SKILL.md" ] && { echo "skills/$b/$1/SKILL.md"; return; }; done; }

          sec "1. skill size <= 300 (no exceptions)"
          # v3.17 P4: dev-gate root is a thin router (167 lines) -> its 400-line exception is gone
          while IFS= read -r f; do
            l=$(wc -l < "$f")
            [ "$l" -gt 300 ] && err "$f: $l lines > 300"
          done < <(find skills -mindepth 3 -name SKILL.md)
          [ $fail -eq 0 ] && ok "all skills within limit"

          sec "2. excluded buckets not in plugin.json"
          for b in $EXCL; do [ -d "skills/$b" ] || continue
            while IFS= read -r f; do n=$(basename "$(dirname "$f")")
              grep -q "\"$n\"" "$PJ" && err "'$n' excluded but in plugin.json"
            done < <(find "skills/$b" -mindepth 2 -name SKILL.md 2>/dev/null); done

          sec "3. shippable bucket paths listed"
          # SHIP is read from plugin.json, so the guard compares it with the bucket folders on disk (minus EXCL)
          for d in skills/*/; do b=$(basename "$d"); case " $EXCL " in *" $b "*) continue ;; esac
            case " $SHIP " in *" $b "*) : ;; *) err "bucket '$b' not listed" ;; esac; done
          for b in $SHIP; do [ -d "skills/$b" ] || err "plugin.json lists bucket '$b' with no skills/$b folder"; done

          sec "4. Cowork caps (length + ASCII + no em-dash)"
          chk(){ local L="$1" t="$2" lim="$3"
            [ "${#t}" -gt "$lim" ] && err "$L length ${#t} > $lim"
            # portable: macOS grep ไม่มี -P -> exit 2 ซึ่งถูกตีความว่า "ไม่พบ" -> check ผ่านทั้งที่ไม่เคยรัน (v3.12)
            printf '%s' "$t" | LC_ALL=C grep -q '[^ -~]' && err "$L non-ASCII"
            printf '%s' "$t" | grep -q '—\|–' && err "$L em/en-dash"; }
          chk "plugin.json description"      "$(jq -r '.description//""' "$PJ")" 200
          chk "marketplace.json description" "$(jq -r '.description//""' "$MK")" 200
          while IFS= read -r d; do chk "marketplace plugins[].description" "$d" 100; done < <(jq -r '.plugins[]?.description//""' "$MK")
          [ $fail -eq 0 ] && ok "description caps ok"

          sec "5. agent model (allowed value + Fable-5 whitelist)"
          for f in agents/*.md; do n=$(basename "$f" .md)
            m=$(awk '/^---$/{c++;next} c==1&&/^model:/{sub(/^model:[ \t]*/,"");gsub(/["'"'"']/,"");print;exit}' "$f")
            [ -z "$m" ] && continue
            case " claude-fable-5 opus sonnet " in *" $m "*) :;; *) err "$n: model '$m' not allowed";; esac
            if [ "$m" = claude-fable-5 ]; then case " $F5 " in *" $n "*) :;; *) err "$n: claude-fable-5 not whitelisted";; esac; fi
          done
          [ $fail -eq 0 ] && ok "agent models ok"

          sec "6. model table single-source (none outside README)"
          while IFS= read -r f; do
            grep -q 'claude-fable-5' "$f" && err "$f: contains 'claude-fable-5'"
            if grep -q '|' "$f" && grep -iE '\|' "$f" | grep -iqE '(fable-5).*(opus|sonnet|haiku)|opus.*(sonnet|haiku)|sonnet.*haiku'; then
              err "$f: model matrix row"; fi
          done < <(find skills -mindepth 3 -name SKILL.md; find commands -name '*.md')

          sec "7. manifest arrays = './' path strings"
          for fn in "$PJ" "$MK"; do for fld in skills commands agents; do
            jq -e --arg f "$fld" '
              def c(a): (a|type)=="array" and (a|all(type=="string" and startswith("./") and (contains("..")|not) and (contains("\\")|not)));
              (if has($f) then c(.[$f]) else true end)
              and (if has("plugins") then (.plugins|all(if has($f) then c(.[$f]) else true end)) else true end)
            ' "$fn" >/dev/null || err "$fn: '$fld' not a clean path-string array"
          done; done

          sec "8. JSON syntax"
          for f in "$PJ" "$MK"; do jq -e . "$f" >/dev/null 2>&1 && ok "$f" || err "$f: invalid JSON"; done

          sec "9. skill + agent frontmatter name + description"
          while IFS= read -r f; do
            awk '/^---$/{c++;next} c==1&&/^name:/{nm=1} c==1&&/^description:/{de=1} END{exit !(nm&&de)}' "$f" || err "$f: missing name/description"
          done < <(find skills -name SKILL.md; find agents -name '*.md')
          # v3.17 FR-P10-1: shipped skill description cap -- it sits in discovery context on every turn (measured max 309 chars)
          for b in $SHIP; do for f in skills/$b/*/SKILL.md; do [ -f "$f" ] || continue
            d9=$(awk '/^---$/{c++;next} c==1&&/^description:/{sub(/^description:[ \t]*/,"");print;exit}' "$f")
            [ "${#d9}" -le 320 ] || err "$f: description ${#d9} chars > 320 -- 1-2 sentences: capability + decision boundary (AGENTS.md)"
          done; done
          # v3.17 FR-P10-3: the Repo Invariants heading names the released version (single source = plugin.json; canonical file = AGENTS.md)
          v9=$(jq -r '.version' "$PJ"); grep -m1 '^## Repo Invariants' AGENTS.md | grep -qF "(v$v9)" || err "AGENTS.md '## Repo Invariants' heading version != plugin.json version (v$v9)"
          [ $fail -eq 0 ] && ok "frontmatter ok"

          sec "10. SKILL name == folder"
          while IFS= read -r f; do d=$(basename "$(dirname "$f")")
            nm=$(awk '/^---$/{c++;next} c==1&&/^name:/{sub(/^name:[ \t]*/,"");gsub(/["'"'"']/,"");print;exit}' "$f")
            [ "$d" = "$nm" ] || err "name '$nm' != folder '$d'"
          done < <(find skills -mindepth 3 -name SKILL.md)
          [ $fail -eq 0 ] && ok "names match folders"

          sec "11. skill cross-refs resolve (dynamic skill list, whole runtime surface — v3.17 FR-G-2)"
          # v3.17: ชื่อ skill derive จาก shipped dir (เดิม regex hardcode ขาด ask/domain-core/data-migration/api-contract
          # และ scan แค่ commands/README/CLAUDE -> pointer ค้างใน agents/skills/fixtures ผ่านเงียบ).
          # "ดูเหมือนชื่อ skill" = token `shode-house-<word>` (bare หรือใน backtick; ไม่นับส่วนกลางของ path/URL และ
          # bd id แบบ shode-house-8ss) ที่ไม่ใช่ shipped dir -> FAIL. in-progress/deprecated ไม่นับว่า resolve.
          ships=$(for b in $SHIP; do for d in skills/$b/*/; do [ -d "$d" ] && basename "$d"; done; done | sort -u)
          SCAN11="agents commands output-styles references eval/fixtures eval/scenarios README.md CLAUDE.md AGENTS.md docs/cowork-validator-history.md docs/repo-invariants"
          for b in $SHIP; do SCAN11="$SCAN11 skills/$b"; done
          s11=""; for x in $SCAN11; do [ -e "$x" ] && s11="$s11 $x"; done
          refs=$(grep -rIhoE '(^|[^A-Za-z0-9_/.-])shode-house-[a-z0-9-]*[a-z0-9]' $s11 2>/dev/null \
                 | grep -oE 'shode-house-[a-z0-9-]*[a-z0-9]' | grep -E '^shode-house-[a-z]+(-[a-z]+)*$' \
                 | grep -vx 'shode-house-v' | sort -u)   # v3.17 G-C5: no length floor (a short `shode-house-xyz` used to slip through);
          #   the only non-skill token of this shape is the artifact name prefix `shode-house-v<MAJOR>...plugin`
          for r in $refs; do
            echo "$ships" | grep -qx "$r" || err "referenced skill '$r' is not a shipped skill: $(grep -rIlE "(^|[^A-Za-z0-9_/.-])$r([^a-z0-9-]|\$)" $s11 | head -3 | tr '\n' ' ')"
          done
          # TOMBSTONE (v3.17 FR-M-1 / Sentinel C3, G-C5) -- permanent: v3.17 removed 4 skills with NO stub, so a
          #   retired name anywhere on the scanned surface is a dead pointer. Names come from the single RETIRED
          #   map (tests/test_team_package.py); patterns, scan set, allowlist and the frozen-eval exclusion
          #   (files pinned by eval/FREEZE.sha256 cannot be edited) live in tests/test_tombstone.py, which also
          #   carries the negative test (backticked bare name, "<name> skill", /shode-house:<name>, path, bare prefixed name).
          if command -v python3 >/dev/null; then
            python3 tests/test_tombstone.py >/dev/null 2>&1 || { err "tombstone: retired skill name still referenced (or negative test broken):"; python3 tests/test_tombstone.py --scan | head -20; }
          else err "tombstone: python3 required"; fi
          # TRACKER-NEUTRAL (v3.17 FR-T-1, 8ss.52) -- permanent: the tracker follows the TARGET project, so no shipped
          #   surface may hardcode a `bd <verb>` command. Allowlist = ONE file (harness.md "Beads example" block);
          #   regex, scan set and the negative test (agent file -> red, harness.md -> green) live in tests/test_tracker_neutral.py.
          if command -v python3 >/dev/null; then
            python3 tests/test_tracker_neutral.py >/dev/null 2>&1 || { err "tracker-neutral: hardcoded bd command outside harness.md (or negative test broken):"; python3 tests/test_tracker_neutral.py --scan | head -20; }
          fi
          # BASH CONTROL PLANE (U22 H1 follow-up) -- permanent: no shipped shell block names a path the C5 Bash guard of
          #   hooks/scripts/guard-scope-write.sh denies (.shode-house itself or its state/journal/scope roots); the pattern
          #   is read from the hook. Scan set, limits and the negative test live in tests/test_bash_control_plane_text.py.
          if command -v python3 >/dev/null; then
            python3 tests/test_bash_control_plane_text.py >/dev/null 2>&1 || { err "bash-control-plane: shipped shell block names a Bash-denied .shode-house path (or negative test broken):"; python3 tests/test_bash_control_plane_text.py --scan | head -20; }
          else err "bash-control-plane: python3 required"; fi
          [ $fail -eq 0 ] && ok "cross-refs resolve ($(echo "$ships" | wc -l | tr -d ' ') shipped skills)"

          sec "11b. every shipped skill is linked in README (v3.12)"
          # #11 ตรวจ ref -> dir; ทางกลับไม่มีใครตรวจ -> skill ใหม่หลุด index ได้เงียบ ๆ
          while IFS= read -r d; do n=$(basename "$d")
            grep -q "skills/[a-z]*/$n/SKILL.md" README.md || err "README: skill '$n' has no link to its SKILL.md"
          done < <(find skills/workflow skills/ops skills/ui skills/style skills/discipline -mindepth 1 -maxdepth 1 -type d)
          [ $fail -eq 0 ] && ok "all shipped skills linked in README"

          sec "12. path refs resolve (README + CLAUDE + AGENTS + repo-invariant docs + agents + skills + commands — v3.12)"
          # เดิมตรวจแค่ README/CLAUDE -> broken link ใน agents/ skills/ ผ่านมาตลอด
          while IFS= read -r src; do
            while read -r p; do [ -e "$p" ] || err "$src: broken ref '$p'"
            done < <(grep -oE '`(skills|commands|agents|references|output-styles|docs)/[^`]+`' "$src" | tr -d '`' \
                     | grep -vE '[<>*?{}]' | sed 's:/$::' | sort -u)
          done < <(printf '%s\n' README.md CLAUDE.md AGENTS.md docs/cowork-validator-history.md docs/repo-invariants/*.md agents/*.md commands/*.md; find skills -name '*.md' -not -path '*/deprecated/*')
          [ $fail -eq 0 ] && ok "path refs resolve"

          sec "13. agent skills: preload resolves to a shipped skill"
          # Claude Code SKIPS a listed skill silently (debug log only) if it is missing
          # or disabled -> discipline never reaches the subagent. Fail loudly here instead.
          shipped=$(for d in skills/workflow/*/ skills/ops/*/ skills/ui/*/ skills/style/*/ skills/discipline/*/; do
                      [ -d "$d" ] && basename "$d"; done | sort -u)
          for f in agents/*.md; do n=$(basename "$f" .md)
            line=$(awk '/^---$/{c++;next} c==1&&/^skills:/{sub(/^skills:[ \t]*/,"");print;exit}' "$f")
            [ -z "$line" ] && { err "$n: missing 'skills:' frontmatter (discipline will not reach subagent)"; continue; }
            n_pre=$(echo "$line" | tr -d '[]"' | tr ',' '\n' | grep -c '[a-z]')
            [ "$n_pre" -le 3 ] || err "$n: preload $n_pre skills -- cap คือ 3 (AGENTS.md)"
            for s in $(preloads "$f"); do
              echo "$shipped" | grep -qx "$s" || err "$n: skills: '$s' not a shipped skill"
              # in-progress/ + deprecated/ are not packaged -> would silently no-op
              [ -d "skills/in-progress/$s" ] && err "$n: skills: '$s' lives in in-progress/ (not shipped)"
              [ -d "skills/deprecated/$s" ] && err "$n: skills: '$s' lives in deprecated/ (not shipped)"
            done
            # every agent must at minimum preload the discipline foundation
            echo "$line" | grep -q 'shode-house-discipline' || err "$n: skills: must include shode-house-discipline"
          done
          [ $fail -eq 0 ] && ok "agent skills: preload resolves"

          sec "14. every agent can invoke skills (Skill in tools:)"
          # v3.10 regression guard: an explicit tools: array WITHOUT "Skill" means the
          # subagent cannot load ANY skill at runtime (docs/en/sub-agents). 0/19 had it before.
          for f in agents/*.md; do n=$(basename "$f" .md)
            t=$(awk '/^---$/{c++;next} c==1&&/^tools:/{sub(/^tools:[ \t]*/,"");print;exit}' "$f")
            [ -z "$t" ] && continue   # omitted tools: inherits everything, incl. Skill
            echo "$t" | grep -q '"Skill"' || err "$n: tools: omits \"Skill\" -> cannot load any skill"
          done
          [ $fail -eq 0 ] && ok "all agents can invoke skills"

          sec "15. output styles have name + description"
          if [ -d output-styles ]; then
            while IFS= read -r f; do
              awk '/^---$/{c++;next} c==1&&/^name:/{nm=1} c==1&&/^description:/{de=1} END{exit !(nm&&de)}' "$f" \
                || err "$f: missing name/description"
            done < <(find output-styles -name '*.md')
            [ $fail -eq 0 ] && ok "output styles ok"
          else ok "no output-styles/ (skipped)"; fi

          sec "16. preload budget per agent (v3.11)"
          # skills: cap 3 controls instruction density but NOT size. Before v3.11 an agent
          # paid ~10k tok of preload before reading its delegation message. Budget is in
          # BYTES (bash-only gate): ~18000 B of Thai-heavy markdown ~= 4000 tokens.
          # Ratchet, not an aspiration: these are today's actual maxima after the v3.11
          # rebalance. They may only ever go DOWN. Adding a section to a preloaded skill
          # now fails CI -> put it in the agent file, or let the agent load it at runtime.
          # v3.12: ratchet จริง = baseline ต่อ agent (เพดานกลางอย่างเดียวปล่อยให้ domain agent
          # โตจาก 16 KB ไป 31 KB ได้โดย CI ไม่รู้ตัว). baseline อยู่ใน .preload-budget
          BUDGET=31000          # เพดานแข็ง — ห้ามเกินไม่ว่ากรณีใด
          GRACE=0               # v3.17 P10: 600 -> 0. keys == measured; เพิ่ม byte ใน preloaded skill = ตัดที่อื่นใน change เดียวกัน หรือแก้ .preload-budget พร้อมเหตุผลใน PR
          BASELINE_FILE=.preload-budget
          for f in agents/*.md; do n=$(basename "$f" .md)
            total=0
            for s in $(preloads "$f"); do
              sf=$(skill_md "$s")
              [ -n "$sf" ] && total=$((total + $(wc -c < "$sf")))   # unresolved name = red in #13, never silently cheap
            done
            [ "$total" -gt "$BUDGET" ] && err "$n: preload ${total}B > ${BUDGET}B hard cap -- move role-specific sections into the agent file, or let it load the skill at runtime"
            base=$(grep -E "^$n=" "$BASELINE_FILE" 2>/dev/null | cut -d= -f2)
            if [ -n "$base" ]; then
              [ "$total" -gt "$((base + GRACE))" ] && err "$n: preload ${total}B > baseline ${base}B + ${GRACE}B grace -- ratchet only goes down; ถ้าตั้งใจโตจริงให้อัปเดต $BASELINE_FILE พร้อมเหตุผลใน PR"
              [ "$total" -lt "$base" ] && echo "  (ratchet: $n ลดจาก ${base}B -> ${total}B -- อัปเดต $BASELINE_FILE ได้เลย)"
            else err "$n: ไม่มี baseline ใน $BASELINE_FILE (agent ใหม่ต้องบันทึก baseline)"; fi
          done
          [ $fail -eq 0 ] && ok "preload within budget"

          sec "17. design-intel pack integrity (v3.11)"
          # Uma's lookup layer: data must never enter context, so it is NOT a skill --
          # but the scripts + CSVs must ship, or every Phase 1b lookup silently no-ops.
          DI=references/design-intel
          if [ -d "$DI" ]; then
            for req in scripts/search.py scripts/check_contrast.py scripts/core.py scripts/design_system.py \
                       data/ux-guidelines.csv data/colors.csv data/typography.csv data/styles.csv README.md; do
              [ -f "$DI/$req" ] || err "design-intel: missing $req"
            done
            [ -d "$DI/data/stacks" ] || err "design-intel: missing data/stacks/"
            grep -q 'design-intel' agents/design.md || err "agents/design.md does not reference design-intel"
            # v3.12: เช็คว่าไฟล์มีอยู่ไม่พอ -- gate ที่ Uma ต้องผ่านทุก Phase 1b ต้องรันได้จริง
            # (รอบก่อนหน้า pack ผ่าน #17 ทั้งที่ check_contrast block ทุก palette ในแคตตาล็อก)
            # U22: scratch files live in a per-run `mktemp -d` under $TMPDIR (removed on exit), never fixed /tmp names:
            # concurrent gates do not overwrite each other's payload and the names cannot be predicted
            if ! command -v python3 >/dev/null; then err "python3 missing -- design-intel smoke skipped"
            elif ! di_tmp=$(mktemp -d "${TMPDIR:-/tmp}/shode-di.XXXXXX"); then err "design-intel: mktemp -d failed under ${TMPDIR:-/tmp} -- smoke not run"
            else
              trap 'rm -rf "$di_tmp"' EXIT
              for q in "saas dashboard" "fintech app" "ecommerce store"; do
                python3 "$DI/scripts/search.py" "$q" --design-system --json > "$di_tmp/ds.json" 2>/dev/null \
                  || { err "design-intel: search.py failed for '$q'"; continue; }
                python3 "$DI/scripts/check_contrast.py" --design-system-json "$di_tmp/ds.json" --border-decorative "CI smoke" > "$di_tmp/cc.txt" 2>&1 \
                  || { err "design-intel: contrast gate BLOCKS catalog palette for '$q' -> Uma Phase 1b would hard-block"; sed -n '1,12p' "$di_tmp/cc.txt"; }
              done
              python3 "$DI/scripts/check_contrast.py" --pair "#9CA3AF,#FFFFFF" >/dev/null 2>&1 \
                && err "design-intel: contrast gate PASSES a 2.54:1 pair -- gate is not enforcing"
              # ปั้น payload ที่มีขอบต่ำกว่า 3:1 แน่นอน แทนการพึ่ง ds.json ที่ค้างจาก loop
              printf '{"design_system":{"colors":{"background":"#FFFFFF","border":"#F2F2F2"}}}' > "$di_tmp/ds-border.json"
              python3 "$DI/scripts/check_contrast.py" --design-system-json "$di_tmp/ds-border.json" >/dev/null 2>&1 \
                && err "design-intel: sub-3:1 border passes without --border-decorative ack -- decision not forced"
              python3 "$DI/scripts/check_contrast.py" --design-system-json "$di_tmp/ds-border.json" --border-decorative "ci" >/dev/null 2>&1 \
                || err "design-intel: --border-decorative ack does not unblock -- Uma runbook would dead-end"
              rm -rf "$di_tmp"; trap - EXIT
            fi
            [ $fail -eq 0 ] && ok "design-intel pack intact + gate runs"
          else ok "no references/design-intel (skipped)"; fi

          sec "18. tool reachability — command/agent เรียก tool ที่ตัวเองไม่ได้รับอนุญาต (v3.12)"
          # blocker ที่ full-scan เจอ: /init สั่งใช้ AskUserQuestion, commands สั่งโหลด skill,
          # /review สั่ง addComment, reviewer ถูกบังคับใช้ browser MCP -- ทั้งหมดไม่อยู่ใน allowed-tools/tools
          for f in commands/*.md; do n=$(basename "$f")
            at=$(awk '/^---$/{c++;next} c==1&&/^allowed-tools:/{sub(/^allowed-tools:[ \t]*/,"");print;exit}' "$f")
            body=$(awk '/^---$/{c++;next} c>=2' "$f")
            echo "$body" | grep -q 'AskUserQuestion' && ! echo "$at" | grep -q 'AskUserQuestion' \
              && err "$n: body uses AskUserQuestion but allowed-tools omits it"
            echo "$body" | grep -qE '(invoke|โหลด|ใช้)[^\n]*`[a-z-]+` skill|Skill tool' && ! echo "$at" | grep -q '\bSkill\b' \
              && err "$n: body loads a skill but allowed-tools omits Skill"
            for t in $(echo "$body" | grep -oE 'mcp__[A-Za-z0-9_]+' | sort -u); do
              echo "$at" | grep -q "$t" || err "$n: body calls $t but allowed-tools omits it"
            done
          done
          for f in agents/*.md; do n=$(basename "$f" .md)
            tl=$(awk '/^---$/{c++;next} c==1&&/^tools:/{print;exit}' "$f")
            [ -z "$tl" ] && continue
            for t in $(awk '/^---$/{c++;next} c>=2' "$f" | grep -oE 'mcp__[A-Za-z0-9_]+' | sort -u); do
              echo "$tl" | grep -q "$t" || err "$n: prompt requires $t but tools: omits it (plugin ships no such MCP)"
            done
            # AskUserQuestion ไม่รองรับใน subagent ที่ spawn ผ่าน Task (code.claude.com/docs/en/agent-sdk/user-input)
            # -> agent file ห้ามประกาศใน tools: และห้ามสั่ง subagent เรียกเอง
            echo "$tl" | grep -q 'AskUserQuestion' \
              && err "$n: tools: declares AskUserQuestion -- subagents cannot call it; ให้ return question bundle แล้วให้ command/main session เปิด popup"
            awk '/^---$/{c++;next} c>=2' "$f" | grep -qE '(ใช้|เรียก|Use) *`?AskUserQuestion' \
              && err "$n: prompt tells the subagent to call AskUserQuestion -- main-session only"
          done
          # skill/reference ที่สั่งให้ agent ใช้ tool -> agent ที่ preload/โหลดมันต้องมีสิทธิ์
          # (blocker: smart-coop สั่ง Oliver ใช้ AskUserQuestion ขณะที่ tools: ของ Oliver ไม่มี)
          while IFS= read -r ref; do
            grep -q 'AskUserQuestion' "$ref" || continue
            # skill/reference ที่พูดถึง AskUserQuestion ต้องระบุชัดว่าเป็น main session
            grep -q 'main session' "$ref" \
              || err "$ref mentions AskUserQuestion without saying it is main-session only (subagents cannot call it)"
            owner=$(grep -oiE '(Oliver|Bella|Patrick|Sara|Aaron|Dave|Chris|Quinn|Uma)' "$ref" | head -1 | tr 'A-Z' 'a-z')
            case "$owner" in
              oliver) af=output-styles/shode-house.md ;; bella|patrick|sara) af=agents/plan.md ;;
              aaron) af=agents/operate.md ;; dave) af=agents/build.md ;;
              chris|quinn) af=agents/verify.md ;; uma) af=agents/design.md ;; *) continue ;;
            esac
            :  # owner map เก็บไว้เพื่อรายงานบริบท; การบังคับอยู่ที่กฎ main-session ข้างบน
          done < <(find skills -name '*.md' -not -path '*/deprecated/*' -not -path '*/in-progress/*')
          [ $fail -eq 0 ] && ok "every referenced tool is reachable"

          sec "19. review dispatch graph — axis ที่ checklist ประกาศ ต้องถูกส่งจริง (v3.12)"
          # blocker: Spec axis เป็น headline ของ 3.12 แต่ kickoff ไม่เคยส่ง agent ไปทำ
          if [ -f skills/discipline/review-checklist/spec-axis.md ]; then
            for c in commands/implement.md commands/review.md; do
              grep -q 'Spec axis' "$c" || err "$c: review-checklist declares a Spec axis but this command never dispatches it"
            done
            [ $fail -eq 0 ] && ok "Spec axis dispatched in implement + review"
          else err "review-checklist lost spec-axis.md"; fi

          # v3.14 (bd:B3): REVIEW DISPATCH CARD -- mandatory pre-fan-out block (mutation-testable:
          # deleting any one literal below must fail this gate). v4 W6 (ADR F-2): the per-axis card lives in the
          # router style; the commands record it as [REVIEW DISPATCH CARD] and point at it.
          RC=commands/review.md; ST=output-styles/shode-house.md
          grep -qF '[REVIEW DISPATCH CARD]' "$RC" || err "$RC: missing literal '[REVIEW DISPATCH CARD]' header"
          for c in "$RC" commands/implement.md; do
            grep -qF '`output-styles/shode-house.md` § Review card' "$c" || err "$c: missing pointer to the router style § Review card"
          done
          for axis in standards spec runtime security domain ui; do
            grep -q "^- axis=$axis: DISPATCH" "$ST" || err "$ST: Review card missing axis line 'axis=$axis'"
          done
          # standards and spec never offer SKIP ("Review has 2 axes"): one exact line each, no other line for either axis
          SD='- axis=standards: DISPATCH `shode-house:verify` (name: verify-standards)'
          SP='- axis=spec: DISPATCH `shode-house:plan` (always; no SKIP) (name: plan-spec; never the spawn that wrote or amended the AC)'
          grep -qxF -- "$SD" "$ST" || err "$ST: standards axis must be exactly: $SD"
          grep -qxF -- "$SP" "$ST" || err "$ST: spec axis must be exactly: $SP"
          ! grep -E '^- axis=(standards|spec):' "$ST" | grep -vxF -e "$SD" -e "$SP" | grep -q . \
            || err "$ST: standards/spec axis must never offer SKIP (an extra or changed axis line)"
          for c in "$RC" commands/implement.md; do
            grep -qF 'spec is always DISPATCH' "$c" || err "$c: missing 'spec is always DISPATCH'"
          done
          grep -qF 'BLOCKED: no-spec' "$RC" || err "$RC: missing literal 'BLOCKED: no-spec' (no spec = missing acceptance, never a spec PASS)"
          grep -qF 'SKIP("no trigger keyword")' "$RC" || err "$RC: missing literal security/domain SKIP reason 'SKIP(\"no trigger keyword\")'"
          grep -qF 'when capacity/dependencies require it; role-play and renamed self-review do not count.' "$RC" || err "$RC: missing independent-worker/serial-capacity constraint"
          grep -qF '[REVIEW DISPATCH CARD]' skills/discipline/review-checklist/intake.md \
            || err "review-checklist/intake.md: missing pointer to [REVIEW DISPATCH CARD]"
          [ $fail -eq 0 ] && ok "REVIEW DISPATCH CARD template + rules intact"

          sec "20. context budget = agent prompt + preload (v3.12)"
          # #16 นับเฉพาะ skill -> Oliver/Uma โตได้ไม่จำกัดใน agent file. อันนี้นับรวมของจริง
          TOTAL_BUDGET=50000   # v3.12.1 ratchet: Oliver 48,856 B
          for f in agents/*.md; do n=$(basename "$f" .md)
            t=$(wc -c < "$f")
            for s in $(preloads "$f"); do
              sf=$(skill_md "$s")
              [ -n "$sf" ] && t=$((t + $(wc -c < "$sf")))
            done
            [ "$t" -gt "$TOTAL_BUDGET" ] && err "$n: agent+preload ${t}B > ${TOTAL_BUDGET}B -- trim the agent prompt, not just the skills"
          done
          [ $fail -eq 0 ] && ok "agent+preload within budget"

          sec "21. enforcement map — source of truth ของทุกกฎยัง resolve ได้ (v3.13 WS1)"
          if [ -f .enforcement-map.json ]; then
            while IFS= read -r p; do
              case "$p" in *"*"*) ls $p >/dev/null 2>&1 || err "enforcement-map: glob '$p' matches nothing" ;;
                            *) [ -e "$p" ] || err "enforcement-map: source of truth '$p' missing" ;; esac
              # v3.17 C2: source of truth ต้องอยู่ใน shipped path -- สำเนาตายใน deprecated/in-progress ห้าม "ถือ" กฎ
              case "$p" in skills/in-progress/*|skills/deprecated/*) err "enforcement-map: source of truth '$p' อยู่ใน bucket ที่ไม่ ship" ;;
                skills/*) b21=$(echo "$p" | cut -d/ -f2); case " $SHIP " in *" $b21 "*) : ;; *) err "enforcement-map: source of truth '$p' ไม่อยู่ใน shipped bucket" ;; esac ;;
              esac
            done < <(jq -r '.rules[].source_of_truth' .enforcement-map.json)
            # v3.13: ไฟล์มีอยู่ไม่พอ -- ต้องพิสูจน์ว่ากฎ 'อยู่ในไฟล์นั้นจริง' ด้วย anchor
            # Fields are joined with U+001F, never `@tsv`: @tsv writes '\' as '\\' (and tab/newline as \t/\n), so an
            # anchor holding a backslash was never found (W5b). A field holding U+001F or a line break cannot be read
            # back exactly (and grep -F would split it into several patterns): it is red, never matched loosely.
            while IFS=$'\x1f' read -r id p anchor; do
              [ "$id" != "!" ] || { err "enforcement-map: rule '$p' มี field ที่มี line break หรือ U+001F -- อ่าน anchor ไม่ได้ตรงตัว"; continue; }
              [ -n "$anchor" ] || { err "enforcement-map: rule '$id' ไม่มี anchor (กฎอาจถูกย้ายออกโดยไม่มีใครรู้)"; continue; }
              [ ${#anchor} -ge 12 ] || err "enforcement-map: rule '$id' anchor '$anchor' สั้นเกินไป (<12 ตัวอักษร = กว้างจนไม่พิสูจน์อะไร)"
              case "$p" in *"*"*) grep -q -- "$anchor" $p 2>/dev/null || err "enforcement-map: rule '$id' anchor '$anchor' ไม่พบใน $p" ;;
                            *) grep -q -F -- "$anchor" "$p" 2>/dev/null || err "enforcement-map: rule '$id' anchor '$anchor' ไม่พบใน $p" ;; esac
            done < <(jq -r '.rules[] | [.id, .source_of_truth, (.anchor // "")] | map(tostring)
                            | if any(.[]; test("[\u001f\n\r]")) then "!\u001f" + (.[0] | gsub("[\u001f\n\r]"; " ")) + "\u001f"
                              else join("\u001f") end' .enforcement-map.json)
            # preload:true = ต้องมี agent preload skill ที่เป็นเจ้าของกฎจริง (ไม่ใช่ 1 ตัว)
            while IFS=$'\t' read -r id p; do
              case "$p" in skills/*/*/SKILL.md)
                sk=$(echo "$p" | cut -d/ -f3)
                c=$(grep -lE "^skills:.*\"($PLUGIN:)?$sk\"" agents/*.md 2>/dev/null | wc -l)
                # 7 of the 18 agents of 4.0.0 (39%), scaled to the roster of this tree: ceil(7 * agents / 18) (3 of 6 in 4.0.1)
                need=$(( (7 * $(ls agents/*.md | wc -l) + 17) / 18 ))
                [ "$c" -ge "$need" ] || err "enforcement-map: rule '$id' ประกาศ preload:true แต่มีแค่ $c agent ที่ preload '$sk' (need $need)" ;;
              esac
            done < <(jq -r '.rules[] | select(.preload==true) | [.id, .source_of_truth] | @tsv' .enforcement-map.json)
            # v3.17 FR-G-3: root_only = กฎ safety ที่ห้ามตกไป lazy tier. source ต้องเป็น ROOT file
            # (shipped SKILL.md / agents/*.md / output-styles/*.md) และไฟล์นั้นต้องไม่มี LOAD: contract block
            while IFS= read -r line21; do
              id=${line21%%|*}; p=${line21#*|}
              ro_ok=0
              case "$p" in *"*"*) : ;;
                agents/*/*|output-styles/*/*) : ;;
                agents/*.md|output-styles/*.md) ro_ok=1 ;;
                skills/*/*/SKILL.md) b21=$(echo "$p" | cut -d/ -f2); case " $SHIP " in *" $b21 "*) ro_ok=1 ;; esac ;;
              esac
              [ $ro_ok -eq 1 ] || { err "enforcement-map: root_only rule '$id' ชี้ '$p' ซึ่งไม่ใช่ root file (shipped SKILL.md / agents/*.md / output-styles/*.md)"; continue; }
              grep -q '^LOAD:' "$p" 2>/dev/null && err "enforcement-map: root_only rule '$id' ชี้ '$p' ซึ่งเป็น lazy reference (มี LOAD: block) -- กฎ safety ต้องอยู่ root tier"
            done < <(jq -r '.rules[] | select(.root_only==true) | "\(.id)|\(.source_of_truth)"' .enforcement-map.json)
            n_ro=$(jq '[.rules[]|select(.root_only==true)]|length' .enforcement-map.json)
            # v4.0.0 switch (W10b): floor raised 123 -> 190 = the measured S3 count (W3 router style +23, W4 floor +16,
            # W5a +12, W5b +16, re-sourced ids keep their count); it only goes up with new root_only anchors
            [ "$n_ro" -ge 190 ] || err "enforcement-map: only $n_ro root_only rules (floor 190) -- safety anchor ถูกถอดออก?"
            n=$(jq '.rules|length' .enforcement-map.json)
            [ "$n" -ge 15 ] || err "enforcement-map: only $n rules -- inventory looks incomplete"
            [ $fail -eq 0 ] && ok "enforcement map resolves + anchor ครบ ($n rules, $n_ro root_only)"
          else ok "no .enforcement-map.json (skipped)"; fi

          sec "22. context budget จาก dispatch graph จริง (v3.13 WS9)"
          # #16/#20 ดู agent เดี่ยว ๆ; อันนี้ดูทั้ง scenario: command + output style + agents + preload + lazy refs
          if [ -f scripts/context-budget.py ] && command -v python3 >/dev/null; then
            python3 scripts/context-budget.py --check || fail=1
            # v3.17 FR-G-4/G-5: frontmatter = byte ใต้ LC_ALL=C ของ shipped skill เท่านั้น; __total__ = ผลรวมจริงทุกไฟล์
            # (เดิม awk `c==2{exit}` จบที่ไฟล์แรก = 403 B ตลอดกาล) ; key set == shipped dir สองทาง (key กำพร้าเคยถูกข้ามเงียบ)
            fm_bytes(){ LC_ALL=C awk '/^---$/{c++;next} c==1{n+=length($0)+1} c>1{exit} END{print n+0}' "$1"; }
            ships22=$(for b in $SHIP; do for d in skills/$b/*/; do [ -f "$d/SKILL.md" ] && basename "$d"; done; done | sort -u)
            keys22=$(grep -vE '^(#|$)' .skill-metadata-budget | cut -d= -f1 | grep -vx '__total__' | sort)
            [ -z "$(echo "$keys22" | uniq -d)" ] || err ".skill-metadata-budget: duplicate key $(echo "$keys22" | uniq -d | tr '\n' ' ')"
            for k in $keys22; do echo "$ships22" | grep -qx "$k" || err ".skill-metadata-budget: key '$k' has no shipped skill dir (stale key)"; done
            for k in $ships22; do echo "$keys22" | grep -qx "$k" || err ".skill-metadata-budget: shipped skill '$k' has no budget key"; done
            grep -q '^__total__=' .skill-metadata-budget || err ".skill-metadata-budget: missing __total__"
            while IFS= read -r line; do
              case "$line" in \#*|"") continue ;; esac
              k=${line%%=*}; v=${line##*=}
              case "$k" in __total__) cur=0; for b in $SHIP; do for f in skills/$b/*/SKILL.md; do [ -f "$f" ] && cur=$((cur + $(fm_bytes "$f"))); done; done ;;
                           *) f=""; for b in $SHIP; do [ -f "skills/$b/$k/SKILL.md" ] && f="skills/$b/$k/SKILL.md"; done
                              [ -n "$f" ] || continue   # stale key already reported above
                              cur=$(fm_bytes "$f") ;;
              esac
              [ -n "$cur" ] && [ "$cur" -gt "$v" ] && err "skill metadata '$k': ${cur}B > budget ${v}B"
            done < .skill-metadata-budget
            # budget key ของ agent สองทางเช่นกัน (ADR-9.4): key ที่ไม่มี agent file = stale
            for bf in .preload-budget .agent-core-budget; do [ -f "$bf" ] || continue
              for k in $(grep -vE '^(#|$)' "$bf" | cut -d= -f1); do [ -f "agents/$k.md" ] || err "$bf: key '$k' has no agents/$k.md (stale key)"; done
            done
            for f in agents/*.md; do n2=$(basename "$f" .md); b=$(grep -E "^$n2=" .agent-core-budget | cut -d= -f2)
              [ -n "$b" ] && [ "$(wc -c < "$f")" -gt "$b" ] && err "$n2: agent body $(wc -c < "$f")B > budget ${b}B"
            done
            [ $fail -eq 0 ] && ok "context budgets within ratchet"
          else ok "no context-budget script (skipped)"; fi

          sec "23. lazy-load contract (v3.13 WS7)"
          # ทุก lazy reference ต้องประกาศ LOAD/WHEN/OWNER/REQUIRED-BEFORE และต้องมีคนเรียกจริง
          while IFS= read -r ref; do
            grep -q '^LOAD:' "$ref" || { err "$ref: lazy reference ไม่มี lazy-load-contract block"; continue; }
            L=$(grep -m1 '^LOAD:' "$ref" | sed 's/^LOAD: *//')
            W=$(grep -m1 '^WHEN:' "$ref" | sed 's/^WHEN: *//')
            O=$(grep -m1 '^OWNER:' "$ref" | sed 's/^OWNER: *//')
            B=$(grep -m1 '^REQUIRED-BEFORE:' "$ref" | sed 's/^REQUIRED-BEFORE: *//')
            [ "$L" = "$ref" ] || err "$ref: LOAD path '$L' ไม่ตรงกับตำแหน่งไฟล์จริง"
            [ -n "$W" ] || err "$ref: ไม่มี WHEN trigger"
            [ -n "$B" ] || err "$ref: ไม่มี REQUIRED-BEFORE gate"
            # ต้องมีคนอ้างถึง (ไม่นับตัวเอง) ไม่งั้นคือ reference กำพร้า
            n_ref=$(grep -rl "$(basename "$ref")" agents skills commands references 2>/dev/null | grep -v "^$ref$" | wc -l)
            [ "$n_ref" -ge 1 ] || err "$ref: ไม่มี caller อ้างถึงเลย (orphan lazy reference)"
            if [ "$O" = router ]; then
              # Router owner form (v4 ADR §5.10; ledger W3 "CI #23 lazy-load OWNER"): the router is the main session,
              # i.e. the router style output-styles/<plugin>.md plus the skill roots it loads as `<plugin>:<skill>`.
              # The main session can Read, so there is no tools: check. Accepted next to agent owners (3.x and 4.x).
              rs="output-styles/$PLUGIN.md"
              [ -f "$rs" ] || { err "$ref: OWNER router แต่ไม่มี router style $rs"; continue; }
              closure="$rs"
              for sk in $(grep -o "$PLUGIN:[a-z0-9-]*" "$rs" | sed "s/^$PLUGIN://" | sort -u); do
                sd=$(skill_md "$sk"); [ -n "$sd" ] && closure="$closure ${sd%/SKILL.md}"
              done
            else
              [ -f "agents/$O.md" ] || err "$ref: OWNER '$O' ไม่ใช่ agent ที่มีอยู่"
              t=$(awk '/^---$/{c++;next} c==1&&/^tools:/{print;exit}' "agents/$O.md")
              [ -z "$t" ] || echo "$t" | grep -q '"Read"' || err "$ref: OWNER $O ไม่มี Read tool จึงโหลด reference นี้ไม่ได้"
              # v3.13: OWNER ต้อง 'เอื้อมถึง' จริง -- pointer ต้องอยู่ใน agent body ของ OWNER
              # หรือใน skill ที่ OWNER preload (ไม่ใช่แค่มีใครสักคนพิมพ์ชื่อไฟล์ไว้ที่ไหนก็ได้)
              closure="agents/$O.md"
              for sk in $(preloads "agents/$O.md"); do
                sd=$(skill_md "$sk"); [ -n "$sd" ] && closure="$closure ${sd%/SKILL.md}"
              done
            fi
            grep -rq "$(basename "$ref")" $closure 2>/dev/null \
              || err "$ref: OWNER $O ไม่มี pointer ไปไฟล์นี้เลยใน body หรือ preload closure ของตัวเอง (กฎย้ายไปที่ที่เจ้าของโหลดไม่ถึง)"
            # ต้องถูก pack
            case "$ref" in skills/in-progress/*|skills/deprecated/*) err "$ref: อยู่ใน bucket ที่ไม่ถูก pack" ;; esac
          done < <(grep -rl '^LOAD:' skills references 2>/dev/null | sort)
          n_c=$(grep -rl '^LOAD:' skills references 2>/dev/null | wc -l)
          [ "$n_c" -ge 10 ] || err "lazy-load contract: เจอแค่ $n_c ไฟล์ -- reference ที่แยกออกไปน่าจะยังไม่ได้ประกาศ contract"
          [ $fail -eq 0 ] && ok "lazy-load contract ครบ ($n_c references)"

          sec "24. section refs + repo invariants + rule conservation (v3.13)"
          # 24a. `X` § Y  -> heading Y ต้องมีจริงใน X (dead section ref คือวิธีที่กฎหายแบบเงียบ ๆ)
          # รองรับ 4 รูปแบบ: repo path · skill-relative (dir/file.md) · ชื่อ skill เปล่า · `<plugin>:<skill>` (namespaced load,
          # v4 ADR §5.10; Bella W10a S-1: checked like a bare skill name, never skipped; another namespace = red)
          while IFS= read -r line; do
            f=${line%%:*}; rest=${line#*:}
            case "$f" in skills/in-progress/*|skills/deprecated/*|CHANGELOG.md) continue ;; esac
            tgt=$(echo "$rest" | sed -n 's/.*`\([A-Za-z0-9/_.:-]*\)` § \([^·`|(),;:]*\).*/\1|\2/p')
            [ -z "$tgt" ] && continue
            file=${tgt%%|*}; secn=$(echo "${tgt#*|}" | sed 's/[[:space:]]*$//' | cut -c1-18)
            [ ${#secn} -lt 4 ] && continue
            case "$file" in
              "$PLUGIN":*) file=${file#"$PLUGIN":}
                case "$file" in ""|*[!a-z0-9-]*) err "$f: อ้าง '$PLUGIN:$file § $secn' แต่ '$file' ไม่ใช่ชื่อ skill (<plugin>:<skill>)"; continue ;; esac ;;
              *:*) err "$f: อ้าง '$file § $secn' ด้วย namespace ที่ไม่ใช่ '$PLUGIN:' -- resolve ในรีโปนี้ไม่ได้"; continue ;;
            esac
            cand=""
            case "$file" in skills/deprecated/*|skills/in-progress/*) err "$f: อ้าง '$file' ซึ่งอยู่ใน bucket ที่ไม่ ship"; continue ;; esac
            if [ -f "$file" ]; then cand="$file"
            else
              case "$file" in
                # v3.17 C2: resolver ห้าม resolve ด้วยสำเนาใน deprecated/in-progress (ไม่ ship = pointer ตาย)
                */*)  cand=$(find skills references agents -path "*/$file" -type f -not -path 'skills/deprecated/*' -not -path 'skills/in-progress/*' 2>/dev/null | head -1) ;;
                *.md) cand=$(find skills references agents -name "$file" -type f -not -path 'skills/deprecated/*' -not -path 'skills/in-progress/*' 2>/dev/null | head -1) ;;
                *)    cand=$(for b in $SHIP; do ls -d "skills/$b/$file/SKILL.md" 2>/dev/null; done | head -1) ;;
              esac
            fi
            [ -n "$cand" ] || { err "$f: อ้าง '$file § $secn' แต่หาไฟล์ '$file' ไม่เจอในรีโป"; continue; }
            grep -qi "^#.*$secn" "$cand" || err "$f: อ้าง '$file § $secn' แต่ไม่พบ heading นั้นใน $cand"
          done < <(grep -rn '` § ' agents skills commands output-styles references README.md CLAUDE.md AGENTS.md docs/cowork-validator-history.md docs/repo-invariants 2>/dev/null)

          # 24b. relative *.md pointer ในไฟล์ skill ต้อง resolve ได้ (sibling ก่อน, ไม่งั้นต้องมีในรีโปจริง)
          while IFS= read -r line; do
            f=${line%%:*}; d=$(dirname "$f")
            case "$f" in skills/in-progress/*|skills/deprecated/*) continue ;; esac
            for m in $(echo "${line#*:}" | grep -o '`[a-z0-9-]*\.md`' | tr -d '`'); do
              [ -f "$d/$m" ] && continue
              find . -name "$m" -not -path './.git/*' -not -path './skills/deprecated/*' -not -path './skills/in-progress/*' | grep -q . \
                || err "$f: pointer '$m' ไม่มีไฟล์นี้อยู่ในรีโปเลย"
            done
          done < <(grep -rn '`[a-z0-9-]*\.md`' skills 2>/dev/null | grep -av '^[^:]*:[0-9]*:LOAD:')

          # 24c. AGENTS.md invariant: skill ที่ผลิต deliverable ต้องมี 2 gate heading
          # ยกเว้นเฉพาะ style skill ที่ไม่ผลิต artifact (v3.17: entry skill `ask` ไม่มี exception แล้ว)
          for f in skills/workflow/*/SKILL.md skills/ops/*/SKILL.md skills/ui/*/SKILL.md \
                   skills/discipline/review-checklist/SKILL.md; do
            grep -q '^## When NOT to use' "$f" || err "$f: ขาด '## When NOT to use' (AGENTS.md invariant)"
            grep -Eq '^## (Required inputs|Inputs and decision boundaries)' "$f" || err "$f: ขาด '## Inputs and decision boundaries' (AGENTS.md invariant)"
            ! grep -q '^## .*refuse without' "$f" || err "$f: heading 'refuse without' เป็น legacy (SPEC §19) -- ใช้ '## Inputs and decision boundaries' + '### Stop and return'"
          done
          # v3.17 P5-C2: the 6 roots with A/B/C stops must carry them in a NON-EMPTY '### Stop and return'
          # inside '## Inputs and decision boundaries' (subsection removed or empty = red)
          for f in skills/workflow/dev-gate/SKILL.md skills/workflow/decompose/SKILL.md skills/workflow/diagnose/SKILL.md \
                   skills/ops/drain/SKILL.md skills/ops/secure/SKILL.md skills/discipline/review-checklist/SKILL.md; do
            n_stop=$(awk '/^## /{inb=($0=="## Inputs and decision boundaries"); ins=0; next}
                          inb && /^### /{ins=($0=="### Stop and return"); if(ins) found=1; next}
                          inb && ins && /[^[:space:]]/{n++}
                          END{print (found?n+0:-1)}' "$f")
            [ "$n_stop" -ne -1 ] || err "$f: ขาด '### Stop and return' ใต้ '## Inputs and decision boundaries' (P5-C2)"
            [ "$n_stop" -ne 0 ] || err "$f: '### Stop and return' ว่าง -- ทุก A/B/C stop ต้องอยู่ที่นี่ (P5-C2)"
          done

          # 24d. rule conservation -> scripts/rule-conservation.py (รันเดี่ยวก็ได้)
          # base: RULE_BASE (phase gate: RULE_BASE=baseline-3.17 make validate; CI: push "before" sha / PR base)
          #       -> local default HEAD (working tree only). Unresolvable ref (new branch = zeros) -> HEAD~1.
          rc_base="${RULE_BASE:-HEAD}"
          git rev-parse -q --verify "$rc_base^{commit}" >/dev/null 2>&1 || rc_base=HEAD~1
          [ -n "${GITHUB_ACTIONS:-}" ] && [ "$(git rev-parse "$rc_base")" = "$(git rev-parse HEAD)" ] && rc_base=HEAD~1
          python3 scripts/rule-conservation.py --base "$rc_base" || fail=1
          # pinned cycle baseline (G-C3): the event base forgets a loss once it is on main; .rule-baseline does not.
          rc_pin="$(grep -v '^#' .rule-baseline 2>/dev/null | tr -d '[:space:]')"
          if ! printf '%s' "$rc_pin" | grep -Eq '^[0-9a-f]{40}$'; then
            err ".rule-baseline: missing or not a full 40-hex commit sha"
          elif ! git cat-file -e "$rc_pin^{commit}" 2>/dev/null; then
            err ".rule-baseline: pinned sha $rc_pin is unknown to this clone (need fetch-depth: 0 and the commit reachable on the remote)"
          else
            python3 scripts/rule-conservation.py --base "$rc_pin" || fail=1
          fi
          python3 tests/test_rule_migrations.py || fail=1
          python3 -m unittest tests/test_rule_conservation.py || fail=1
          # 24e. one source per rule: a rule line of AGENTS.md § Repo Invariants must not be copied into any file under docs/
          #   (matching rule + negative tests live in tests/test_docs_no_rule_copy.py; this is NOT a two-copy sync gate)
          python3 tests/test_docs_no_rule_copy.py >/dev/null 2>&1 || { err "docs restate a rule of AGENTS.md (or negative test broken) -- keep the rule in AGENTS.md only:"; python3 tests/test_docs_no_rule_copy.py --scan | head -20; }

          [ $fail -eq 0 ] && ok "section refs + invariants + rule conservation"

          sec "25. full-team preservation and discovery adapters (structural, not live acceptance)"
          python3 scripts/pack-team.py --check plugins/shode-house || fail=1
          python3 scripts/pack-team.py --host antigravity --check plugins/shode-house-antigravity || fail=1
          python3 -m unittest tests.test_codex_adapter || fail=1
          # 25b retired (v4 R42/R48, S2 integration v7u.4.12): generated entries are source verbatim + a resolution footer,
          #   no longer thin adapters; the parity audit above (--check) is the gate for the generated tree
          python3 tests/test_team_entry.py || fail=1
          python3 tests/test_team_candidate.py || fail=1
          python3 tests/test_team_run_check.py || fail=1
          python3 tests/test_context_budget.py || fail=1
          python3 tests/test_root_safety_anchors.py || fail=1   # v3.17 FR-G-3 AC4: static root-safety anchors
          python3 -m unittest tests.test_core_scenarios >/dev/null 2>&1 || { fail=1; python3 -m unittest tests.test_core_scenarios 2>&1 | tail -15; }   # v3.17 E-6: core scenario shape/fixture integrity

          sec "26. plugin archive = .pack-allowlist, and shipped text points at nothing outside it"
          # what ships is one explicit list (the Makefile recipe reads it); docs/, AGENTS.md, CLAUDE.md, README, CHANGELOG do not ship.
          # reference forms, exemptions and negative tests live in tests/test_pack_allowlist.py
          # a check that could not run is printed, never folded into a bare "ok" (no node -> the shipped .js is not parsed)
          if python3 tests/test_pack_allowlist.py >/dev/null 2>&1; then
            skipped=$(python3 tests/test_pack_allowlist.py --scan | grep '^SKIP' || true)
            if [ -n "$skipped" ] && [ -n "${CI:-}" ]; then err "in CI every shipped file must be parsed -- NOT CHECKED: $skipped"
            elif [ -n "$skipped" ]; then printf '  ~ PARTIAL allowlist ok, no dangling reference in shipped text -- NOT CHECKED: %s\n' "$skipped"
            else ok "allowlist ok, no dangling reference in shipped text, shipped .sh/.py/.js parse"; fi
          else err "pack allowlist / dangling reference (python3 tests/test_pack_allowlist.py for the full report):"; python3 tests/test_pack_allowlist.py --scan | head -20; fi

          sec "27. v4 gates: A1 tools pin, A8 skill names + spawn forms, A2 safety floor, A16 shipped-text lint, A15 design runner, W9 eval suites (ADR §7 W1)"
          # One data switch: REQ4=1 from plugin.json major 4 (W10's switch commit) or SHODE_REQUIRE_V4=1 (rehearsal; it can
          # only turn checks on). While REQ4=0 every TREE check below is wired but NOT yet required: findings print as
          # '~ advisory', never folded into a bare ok (3.17.2: ux Bash + orchestrator, `code-index`, no floor text, the two
          # `CLAUDE_PLUGIN_ROOT:-.` fallbacks). The unit + mutation tests of every check are required now.
          # A1 also keeps one required tree ratchet now: the 4.0.0 pin may report only the planned switch (EXPECTED_3X_GAP).
          v4tree(){ # $1 label, $2 findings, $3 scan rc
            if [ "$3" -eq 0 ]; then ok "$1"
            elif [ $REQ4 -eq 1 ]; then err "$1 (required from 4.0.0):"; echo "$2" | head -20
            else printf '  ~ advisory (%s required from 4.0.0): %s finding(s)\n' "$1" "$(echo "$2" | grep -c .)"; echo "$2" | head -20 | sed 's/^/      /'; fi; }
          for t in test_agent_tools_pin test_skill_names test_shipped_text_lint test_floor test_gate27_wiring test_ci_wiring test_ux_design_runbooks test_eval_runners test_reference_toc test_core_roster test_probes_401 test_battery_401; do   # test_floor: R45; test_ux_design_runbooks: R68/S7-1; test_reference_toc: U23-5; test_core_roster: 4.0.1 roster/routing/review-card/hook-key gates (always required); test_probes_401: pre-registered E19/E20 probes + no-fable-dispatch scorer
            python3 tests/$t.py >/dev/null 2>&1 || { err "tests/$t.py red (unit/mutation tests always required; from 4.0.0 also the tree):"; python3 tests/$t.py 2>&1 | grep -E '^(FAIL|ERROR)'; }
          done
          a1=$(python3 tests/test_agent_tools_pin.py --scan 2>&1); v4tree "A1 tools pin" "$a1" $?
          a8=$(python3 tests/test_skill_names.py --scan 2>&1); v4tree "A8 skill names + spawn forms" "$a8" $?
          a16a=$(python3 tests/test_shipped_text_lint.py --scan a 2>&1); v4tree "A16(a) no CLAUDE_PLUGIN_ROOT fallback in shipped text" "$a16a" $?
          a16b=$(python3 tests/test_shipped_text_lint.py --scan b 2>&1); v4tree "A16(b) no floor-relaxing text outside the floor markers" "$a16b" $?
          if [ $REQ4 -eq 1 ]; then
            # --require explicitly: the required mode must not depend on floor.py's own version parse agreeing with REQ4
            if [ -f scripts/floor.py ]; then python3 scripts/floor.py --check --require || err "A2 safety floor: scripts/floor.py --check --require red (required from 4.0.0)"
            else err "A2 safety floor: scripts/floor.py missing (required from 4.0.0)"; fi
          elif [ -f scripts/floor.py ]; then
            fl=$(python3 scripts/floor.py --check 2>&1); fl_rc=$?
            if [ $fl_rc -eq 0 ]; then ok "A2 safety floor (advisory until 4.0.0)"
            else printf '  ~ advisory (A2 required from 4.0.0): floor check red\n'; echo "$fl" | head -10 | sed 's/^/      /'; fi
          else printf '  ~ advisory (A2 required from 4.0.0): scripts/floor.py not present yet -- NOT CHECKED\n'; fi
          # A15 (router decision on the W12 review): the design runner is security-critical, so its suite is REQUIRED in
          # every mode, here and locally. Isolation: tests/fixtures/design_run/gitiso.py gives every git call its own
          # HOME/GIT_CONFIG_GLOBAL/XDG_CONFIG_HOME under the test tmp dir + GIT_CONFIG_NOSYSTEM=1 and refuses otherwise;
          # the pytest process itself also runs with GIT_CONFIG_NOSYSTEM=1 and a throwaway HOME/XDG (user site kept).
          # Runner needs: git >= MIN_GIT of design_run.py (ubuntu-latest ships a newer /usr/bin/git), python3 + pytest
          # (CI: the setup-python step installs it from the hash-pinned .github/requirements-ci.txt; if still missing, a
          # private venv from the SAME file -- never `pip --user` into a PEP 668 system python, Chris W1 r2 R2-3 / C-7);
          # no node, no Playwright (the suite uses stub binaries). The venv is removed after the W9 block below in every
          # case, also when pip failed (C-7).
          # A missing suite file is red, never a silent ok (Bella W1 r2 N1 / W12 F-12; tests/test_gate27_wiring.py).
          [ -f tests/test_design_run.py ] || err "A15 design runner suite: tests/test_design_run.py missing -- NOT CHECKED (required in every mode)"
          # U22 iter 2 (Chris L3): the venv dir also has an EXIT trap (an interrupted gate leaves no venv behind); the
          # trap is cleared after the explicit removal below, like the design-intel scratch dir of #17.
          a15py=python3; a15v=""
          if ! python3 -c 'import pytest' 2>/dev/null && [ -n "${CI:-}" ]; then
            a15v=$(mktemp -d) && trap 'rm -rf "${a15v:-}"' EXIT && python3 -m venv "$a15v/venv" >/dev/null 2>&1 \
              && "$a15v/venv/bin/python" -m pip install --quiet --require-hashes --only-binary :all: -r .github/requirements-ci.txt >/dev/null 2>&1 \
              && a15py="$a15v/venv/bin/python"
          fi
          a15ok=0; "$a15py" -c 'import pytest' 2>/dev/null && a15ok=1
          # pyt: one isolated pytest run: own HOME/GIT_CONFIG_GLOBAL/XDG under a fresh temp dir, user site kept. Its body is
          # a subshell, so the EXIT trap removes that dir on any exit; a failed `mktemp -d` is red (exit 1), never a run
          # with HOME=/home, GIT_CONFIG_GLOBAL=/gitconfig (U22 iter 2, Chris L3).
          pyt()(
            h=$(mktemp -d) && [ -n "$h" ] && [ -d "$h" ] || { echo "pyt: mktemp -d failed -- pytest not run"; exit 1; }
            trap 'rm -rf "$h"' EXIT
            env GIT_CONFIG_NOSYSTEM=1 HOME="$h/home" GIT_CONFIG_GLOBAL="$h/gitconfig" XDG_CONFIG_HOME="$h/xdg" \
              PYTHONUSERBASE="$("$a15py" -m site --user-base)" PYTHONDONTWRITEBYTECODE=1 "$a15py" -m pytest -q -p no:cacheprovider "$@" 2>&1
          )
          if [ -f tests/test_design_run.py ]; then
            if [ $a15ok -eq 1 ]; then
              a15=$(pyt tests/test_design_run.py); a15_rc=$?
              if [ $a15_rc -eq 0 ]; then ok "A15 design runner suite ($(echo "$a15" | tail -1))"
              else err "A15 design runner suite red (tests/test_design_run.py):"; echo "$a15" | grep -E '^(FAILED|ERROR)|passed|failed' | head -20; fi
            else err "A15 design runner suite: pytest not importable -- NOT CHECKED (python3 -m pip install --require-hashes --only-binary :all: -r .github/requirements-ci.txt)"; fi
          fi
          # W9 eval suites (bd v7u.4.7 W9 wiring; required in every mode, like A15): the frozen 4.0 core scenario set's own
          # manifest + derivation (python3 only), then the v4-security scorer and shadow-floor suites (pytest, the A15
          # interpreter and isolation). A missing script or suite directory is red, never a skip.
          if [ -f eval/scenarios/core-4.0/check-freeze.sh ]; then
            if w9f=$(bash eval/scenarios/core-4.0/check-freeze.sh 2>&1); then ok "W9 $w9f"
            else err "W9 core-4.0 freeze red (bash eval/scenarios/core-4.0/check-freeze.sh):"; echo "$w9f" | head -10; fi
          else err "W9 core-4.0 freeze: eval/scenarios/core-4.0/check-freeze.sh missing -- NOT CHECKED (required in every mode)"; fi
          # 4.0.1 (shode-house-jni): the 6-type core set, derived from the frozen 4.0 set; required in every mode like 4.0
          if [ -f eval/scenarios/core-4.0.1/check-freeze.sh ]; then
            if w9g=$(bash eval/scenarios/core-4.0.1/check-freeze.sh 2>&1); then ok "W9 $w9g"
            else err "W9 core-4.0.1 freeze red (bash eval/scenarios/core-4.0.1/check-freeze.sh):"; echo "$w9g" | head -10; fi
          else err "W9 core-4.0.1 freeze: eval/scenarios/core-4.0.1/check-freeze.sh missing -- NOT CHECKED (required in every mode)"; fi
          # 4.0.1 routing-probe battery (P01..P47 mapped to the 6 types, additive to the frozen baseline); required in every mode
          if [ -f eval/scenarios/battery-4.0.1/check-freeze.sh ]; then
            if w9h=$(bash eval/scenarios/battery-4.0.1/check-freeze.sh 2>&1); then ok "W9 $w9h"
            else err "W9 battery-4.0.1 freeze red (bash eval/scenarios/battery-4.0.1/check-freeze.sh):"; echo "$w9h" | head -10; fi
          else err "W9 battery-4.0.1 freeze: eval/scenarios/battery-4.0.1/check-freeze.sh missing -- NOT CHECKED (required in every mode)"; fi
          w9s=""
          for d in eval/v4-security/tests eval/shadow-floor/tests; do
            if [ -d "$d" ]; then w9s="$w9s $d"; else err "W9 eval suite: $d missing -- NOT CHECKED (required in every mode)"; fi
          done
          if [ -n "$w9s" ]; then
            if [ $a15ok -eq 1 ]; then
              w9=$(pyt $w9s); w9_rc=$?
              if [ $w9_rc -eq 0 ]; then ok "W9 eval suites ($(echo "$w9" | tail -1))"
              else err "W9 eval suites red ($w9s):"; echo "$w9" | grep -E '^(FAILED|ERROR)|passed|failed' | head -20; fi
            else err "W9 eval suites: pytest not importable -- NOT CHECKED (python3 -m pip install --require-hashes --only-binary :all: -r .github/requirements-ci.txt)"; fi
          fi
          rm -rf "${a15v:-}"; trap - EXIT
          [ $fail -eq 0 ] && ok "v4 gate tests (REQ4=$REQ4, plugin.json major $VMAJ; A1/A8/A16 tree + A2 required only when REQ4=1)"

          echo
          if [ $fail -eq 0 ]; then echo "== ALL GATE CHECKS PASS =="; else echo "== GATE FAILED =="; fi
          exit $fail

      - name: Per-run usage comparator regression tests
        run: python3 -m unittest discover -s tests -p 'test_usage_report.py'

      - name: Optional drain template contract (mock host, not live qualification)
        run: node --test tests/test_drain_template.mjs

      - name: Eval scorer smoke test (committed recorded transcripts, no live agent run)
        # bd:B3 -- eval-scorer.py itself is stdlib-only (see its own docstring), so this needs no
        # extra dependency install. It runs against transcripts already committed under
        # eval/fixtures/transcripts/ (the same fixtures tests/test_eval_scorer.py uses) -- CI
        # never spawns a live Claude Code session: one real GS1 E2E run costs ~1.9M tokens /
        # ~11 min (see eval/baseline/e2e-golden/GS1-BASELINE.md), which is not something CI
        # should be doing on every push/PR.
        run: |
          set -e
          echo "-- PASS-path fixture (routing-ok / GS2-implement-backend) --"
          python3 scripts/eval-scorer.py eval/fixtures/transcripts/routing-ok \
            --scenario GS2-implement-backend --project eval/fixtures/outputs-root --bd-id bd-101
          echo
          echo "-- FAIL-path fixture (routing-wrong-order / GS2-implement-backend) -- must exit non-zero --"
          if python3 scripts/eval-scorer.py eval/fixtures/transcripts/routing-wrong-order \
              --scenario GS2-implement-backend --project eval/fixtures/outputs-root --bd-id bd-101; then
            echo "FATAL: routing-wrong-order fixture did not fail the scorer -- gate is not enforcing"
            exit 1
          fi
          echo "confirmed: scorer correctly FAILs on a known-bad recorded transcript"
          echo "-- behaviour opt-in (failure_modes.yaml G1/G3): behaviour-ok must PASS, routing-ok must FAIL --"
          B="--scenario GS2-implement-backend --project eval/fixtures/outputs-root --bd-id bd-101 --behaviour-checks G1,G3"
          python3 scripts/eval-scorer.py eval/fixtures/transcripts/behaviour-ok $B && ! python3 scripts/eval-scorer.py eval/fixtures/transcripts/routing-ok $B || { echo "FATAL: behaviour opt-in gate is not enforcing"; exit 1; }

      - name: GS1 E2E regression gate (vs eval/baseline/e2e-golden/GS1-BASELINE.md)
        # bd:B3 -- compares the *committed* score.json for each baseline run (real E2E sessions
        # already run and recorded, not re-run here) against the tolerance already declared in
        # GS1-BASELINE.md's own "## Regression gate" section (both the run list and the cost
        # caps are parsed from that file, not hardcoded in the script).
        run: python3 scripts/eval-regression-gate.py

      - name: workflow-state.sh test suite (bd:shode-roadmap/C-A4)
        # Milestone A tracer bullet -- outputs/shode-roadmap/C/05-oliver-decisions.md CI budget
        # rule: "1 AC = 1 test case ในสวีท ไม่ใช่ 1 CI section" -- this is the ONE step this
        # milestone is allowed to add. bash + jq only, no new dependency (ADR-C3).
        run: bash tests/test-workflow-state.sh

      - name: Registry + route/policy-check test suite (bd:shode-roadmap/C-B1)
        # Milestone B (capability registry + routing registry + resolver + policy check) --
        # same CI budget rule as Milestone A: this is the ONE step this milestone is allowed
        # to add. bash + jq only, no new dependency.
        run: bash tests/test-registry.sh

      - name: Scope-check test suite (bd:shode-roadmap/C-E1)
        # Milestone E (scope manifest + shared-file strategy + optimistic conflict check,
        # ROADMAP-runtime-10.md SS7.1-7.3) -- same CI budget rule as Milestone A/B: this is
        # the ONE step this milestone is allowed to add. bash + jq + shasum only, no new
        # dependency.
        run: bash tests/test-scope-check.sh

      - name: Permission-check test suite (bd:shode-roadmap/C-F1)
        # Milestone F (tool permission profiles + delegation + trust cascade,
        # ROADMAP-runtime-10.md SS11.1-11.3 + SS12) -- same CI budget rule: this is the
        # ONE step this milestone is allowed to add. The suite includes the registry
        # drift checks (references/security/*.json must match agents/*.md `tools:`
        # frontmatter verbatim), so no extra step is needed for those. bash + jq only.
        run: bash tests/test-permission-check.sh

      - name: Reliability test suite (bd:shode-roadmap/C-D1)
        # Milestone D (retry/rework/resume separation, side-effect ledger, approval
        # invalidation, ROADMAP-runtime-10.md Phase 6/8.3/9) -- same CI budget rule as
        # every prior milestone: this is the ONE step Milestone D is allowed to add.
        # bash + jq + shasum + git only, no new dependency.
        run: bash tests/test-reliability.sh

      - name: Hooks fixture test suite (bd:shode-roadmap/C-A7)
        # Milestone A/G runtime enforcement (hooks/**, ADR-C1/C2/C8,
        # 08-sentinel-threat-model-hooks.md AC-S1..S9/S11) -- same CI budget rule as every
        # prior milestone: this is the ONE step this task is allowed to add. Covers
        # hooks.json static shape (AC-S3/S9), bash -n + shellcheck + forbidden-pattern
        # hygiene on every hooks/scripts/*.sh (AC-S4/S5/S6), the guard's jq-extract +
        # canonicalize bypass fixtures (Sentinel's T1-T6 + new vectors this task adds,
        # AC-S8), SessionStart/Stop degradation + torn-write behavior (ADR-C8), the no-op
        # latency NFR, and packaging (hooks/ ships with exec bits intact). bash + jq +
        # zip/unzip only, no new dependency (shellcheck/zipinfo checks self-skip loudly
        # if absent from the runner instead of failing the build).
        run: bash tests/test-hooks.sh

      - name: Lock primitive test suite (bd:shode-house-vz8)
        # scripts/lib/lock.sh -- the single shared mkdir-lock implementation extracted
        # from scripts/side-effect.sh, scripts/workflow-state.sh, scripts/scope-check.sh
        # (each had carried a byte-near-identical copy, and each had independently
        # measured the SAME bootstrap race). Generic contract (exactly-one-holder,
        # non-holder-cannot-release, no-auto-reap, explicit-audited-recover,
        # recover-cannot-delete-a-newer-holder) -- the per-file reproduced-then-fixed
        # concurrency shapes live in the reliability/scope-check suites above, which
        # exercise this same library through its three real consumers. bash + jq +
        # zip/unzip/zipinfo only (the packaging check self-skips if any are absent),
        # no new dependency.
        run: bash tests/test-lock.sh

      # The archive that gets uploaded is checked as built, and one shipped script is run from it
      # unpacked: a file a script opens at run time has to be IN the archive, not just in the repo.
      # `make pack` may add exactly one path to the working tree: the archive (git-ignored, so the
      # comparison lists ignored and untracked files too, one per line, before and after).
      - name: Build .plugin artifact
        run: |
          # an archive left by an earlier suite is removed first; the snapshot is a file, so a tree with no untracked path compares as empty
          rm -f shode-house-v*.plugin
          # U22 iter 2 (Chris L2/L3): an unpredictable snapshot name, and an EXIT trap for it and the unpack dir
          before=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/pack-tree-before.XXXXXX") || exit 1
          d=""; trap 'rm -rf "$before" ${d:+"$d"}' EXIT
          tree_state() { git status --porcelain --untracked-files=no; git ls-files --others; }
          tree_state > "$before"
          make pack
          changed=$(tree_state | diff "$before" - | grep '^[<>]' || true); rm -f "$before"
          [ "$changed" = "> $(ls shode-house-v*.plugin)" ] || { echo "make pack must add exactly one path to the working tree, the archive; the tree changed by:"; echo "${changed:-(nothing: make pack wrote no archive)}"; exit 1; }
          python3 tests/test_pack_allowlist.py --archive shode-house-v*.plugin
          d=$(mktemp -d) && unzip -q shode-house-v*.plugin -d "$d"
          out=$(cd "$d" && bash scripts/policy-check.sh ci-archive-smoke 2>&1) || { echo "$out" | tail -5; echo "scripts/policy-check.sh fails when run from the unpacked archive"; rm -rf "$d"; exit 1; }
          echo "$out" | tail -1; rm -rf "$d"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shode-house-plugin
          path: shode-house-v*.plugin
          if-no-files-found: error
